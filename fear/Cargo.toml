[package]
name = "fear"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "fearc"
[[bin]]
name = "fearopt"
[[bin]]
name = "feardump"
[[bin]]
name = "fearlink"

[features]
default = ["binary-ir"]
serde = ["dep:serde", "target-lexicon/serde"]
binary-ir = ["serde", "dep:bincode", "dep:zstd"]
llvm = ["dep:inkwell"]
cranelift = [
  "dep:cranelift",
  "dep:cranelift-module",
  "dep:cranelift-frontend",
  "dep:cranelift-object",
]

[dependencies]
enum-display = "0.2.1"
log = "0.4.29"
pretty_env_logger = "0.5.0"
thiserror = "2.0.18"
inkwell = { version = "0.9.0", optional = true }
target-lexicon = { version = "0.13.5" }
cranelift = { version = "0.132.0", optional = true }
cranelift-module = { version = "0.132.0", optional = true }
cranelift-frontend = { version = "0.132.0", optional = true }
cranelift-object = { version = "0.132.0", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
zstd = { version = "0.13", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
