[package]
name = "mirssa"
version = "0.0.0"
edition = "2024"

[features]
default = ["cranelift", "hashbrown"]
hashbrown = ["quasar/hashbrown"]
llvm = ["dep:inkwell"]
cranelift = [
  "dep:cranelift",
  "dep:cranelift-module",
  "dep:cranelift-frontend",
  "dep:cranelift-object",
]

[dependencies]
enum-display = "0.2.1"
log = "0.4.29"
pretty_env_logger = "0.5.0"
thiserror = "2.0.18"
inkwell = { version = "0.9.0", optional = true }
quasar = { workspace = true }
pest = { version = "2.8.6", features = ["pretty-print"] }
pest_derive = "2.8.6"
target-lexicon = { version = "0.13.5" }
cranelift = { version = "0.131.1", optional = true }
cranelift-module = { version = "0.131.1", optional = true }
cranelift-frontend = { version = "0.131.1", optional = true }
cranelift-object = { version = "0.131.1", optional = true }
