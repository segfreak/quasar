[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"
debug = true

[profile.release]
debug = false
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
# rustflags = ["-Clink-arg=--ld-path=wild"]
rustflags = ["-Clink-arg=-fuse-ld=lld"]
